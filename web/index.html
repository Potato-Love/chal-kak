<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Photo Guide</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Photo Guide</h1>

    <div id="referenceScreen" class="reference-screen">

        <h2>Reference 선택</h2>

        <div class="reference-viewer">

            <button id="prevReferenceButton" type="button">
                ‹
            </button>

            <img id="referencePreview" src="../reference_01.jpg" alt="Reference Preview">

            <button id="nextReferenceButton" type="button">
                ›
            </button>

        </div>

        <div id="referenceThumbnails" class="reference-thumbnails"></div>

        <p id="referenceNumber">
            Reference 01
        </p>

        <button id="selectReferenceButton" type="button">
            선택
        </button>

    </div>

    <div class="camera-container">

        <video id="video" autoplay playsinline muted></video>

        <canvas id="overlay"></canvas>

    </div>

    <div id="captureFlash"></div>

    <div id="capturePreviewScreen" class="capture-preview-screen">

        <img id="capturedImage" alt="촬영 결과">

        <div class="capture-preview-controls">

            <button id="retakeButton" type="button">
                다시 촬영
            </button>

            <button id="savePhotoButton" type="button">
                저장
            </button>

        </div>

    </div>

    <button id="backToReferenceButton" type="button" aria-label="Reference 선택으로 돌아가기">
        ←
    </button>

    <button id="mirrorButton" type="button" aria-label="미러 모드" aria-pressed="false">
        ⇆
    </button>

    <button id="captureButton" type="button" aria-label="사진 촬영"></button>

    <button id="switchCameraButton" type="button" aria-label="카메라 전환">
        ↻
    </button>

    <script type="module" src="app.js"></script>

</body>

</html>
